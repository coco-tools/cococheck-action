name: Renovate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-config:
    name: Validate the Renovate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate the Renovate config
        run: npx --yes --package renovate@latest -- renovate-config-validator --strict

      - name: Upload the npm debug logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-debug-logs
          path: ~/.npm/_logs/*.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
