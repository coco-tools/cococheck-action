name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cococheck:
    name: CoCoCheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cover all platforms with a prebuilt binary, including Windows on ARM64, which uses the x64
        # binary.
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the full history, so that the commits to check can be found.
          fetch-depth: 0
      # Check the commits of this repository with the action itself.
      - uses: ./

  cococheck-missing-from:
    name: CoCoCheck (start commit missing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # After a force-push, the previous head of the branch is usually not part of the clone.
      # Simulate this with a commit that does not exist, so that only `to` is checked.
      - uses: ./
        with:
          from: 1234567890abcdef1234567890abcdef12345678

  cococheck-latest:
    name: CoCoCheck (latest release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./
        with:
          version: latest

  cococheck-source:
    name: CoCoCheck (built from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./
        with:
          cococheck-ref: main
